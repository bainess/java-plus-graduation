server:
  port: 8080

spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
      routes:
        - id: ewm-main-service-read
          uri: lb://ewm-main-service
          predicates:
            - Path=/categories/**,/compilations/**,/events/**,/users/**,/locations/**,/admin/**
            - Method=GET
          filters:
            - name: Retry
              args:
                retries: 2
                statuses:
                  - BAD_GATEWAY
                  - SERVICE_UNAVAILABLE
                  - GATEWAY_TIMEOUT
                methods:
                  - GET
                backoff:
                  firstBackoff: 100ms
                  maxBackoff: 500ms

        - id: ewm-main-service
          uri: lb://ewm-main-service
          predicates:
            - Path=/categories/**,/compilations/**,/events/**,/users/**,/locations/**,/admin/**

logging:
  level:
    org.springframework.cloud.gateway: TRACE
    org.springframework.cloud.loadbalancer: TRACE
    reactor.netty.http.server: DEBUG