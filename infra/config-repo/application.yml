logging:
  level:
    ru.yandex.practicum.core: warn
    org:
    springframework: ERROR
    ru.yandex.practicum.stat: warn

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
  instance:
    hostname: localhost
    prefer-ip-address: false
    instance-id: ${spring.application.name}:${random.value}